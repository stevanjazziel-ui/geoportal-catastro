name: Publish active geoportal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare active site and preserve repository history
        run: python3 tools/prepare_pages_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _gh_pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy active site
        id: deployment
        uses: actions/deploy-pages@v5
