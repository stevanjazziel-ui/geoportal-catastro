<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirigiendo visor de Riobamba</title>
  <meta http-equiv="refresh" content="0; url=./riobamba-censo.html" />
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3ea;
      --panel: rgba(250, 252, 247, 0.96);
      --line: rgba(51, 76, 65, 0.14);
      --text: #293330;
      --muted: #61736a;
      --accent: #2f6f5f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(47, 111, 95, 0.08), transparent 28%),
        linear-gradient(180deg, #f7faf5, var(--bg));
    }

    .card {
      width: min(100%, 560px);
      padding: 28px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(65, 88, 78, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 3vw, 2.1rem);
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Redirigiendo al visor estable</h1>
    <p>La ruta clara anterior ya no se usa para evitar confusiones entre versiones.</p>
    <p>Si no te redirige automaticamente, abre <a href="./riobamba-censo.html">riobamba-censo.html</a>.</p>
  </main>
  <script>
    window.location.replace("./riobamba-censo.html");
  </script>
</body>
</html>
